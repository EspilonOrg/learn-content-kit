# Fill-in template for a Model-B lab.yaml.
#
# A Model-B lab is authored from this pair of files (lab.yaml next to a
# compose.yaml) and then submitted through the Espilon Learn member portal. The
# maintainers place it in the platform's labs repository when it is ingested, so
# you fill it in here and hand it off; you do not deploy it yourself.
#
# Lint this file before you submit:
#   python3 validators/check_lab_yaml.py templates/model-b-lab
# It checks the required keys, the two enums, the exactly-one-of flag rule, the
# success_criteria shape, and the compose strict-subset rules. docs/model-b-lab.md
# is the full field reference. When a rule is genuinely unclear for your protocol,
# ask through the portal rather than guessing.
#
# Model B (the house delivery model): the player brings their own kali/tools,
# the lab ships ONLY the target service(s), the flag travels over the protocol,
# and there is no in-lab shell and no in-lab file. docs/model-b-lab.md states the
# full delivery contract.

slug: lab-example-model-b   # 'lab-' prefix; the maintainers reconcile this slug with the live lab row at ingestion
title: "Example Model-B Lab"

# category is a closed enum:
#   hardware firmware iot ot-ics esp32 wifi bluetooth drone camera misc
# Pick the enum value for category; it is independent of any folder name the
# maintainers file the lab under.
category: iot

# difficulty is a closed enum: easy medium hard insane. It is tied loosely to
# points (easy <= 200, hard >= 300).
difficulty: easy
points: 200
tags: [iot, example, probe, model-b]

description: |
  Describe the target and the goal as a player sees them. State the protocol, the
  objective, and the attack class. End with the Model-B contract so expectations
  are set: you attack the exposed target from your own machine, the flag travels
  over the protocol, there is no shell and no file.

archetype: iot-mqtt          # a front-end hint; drives which viewer renders next to the panel
radios_required: 0           # simulated radio interfaces the runtime allocates (default 0)
caps_required: []            # docker caps to add; the runtime denies anything off-allowlist
duration_minutes: 45         # auto-destroy TTL; a session heartbeat can extend it

# How the flag is collected. type is 'flag_submit'. hint is the always-available
# player guidance.
success_criteria:
  type: flag_submit
  hint: |
    Install the espilon-probe client (your lab panel links the current build),
    point it at the endpoint shown on your lab panel, then work the protocol
    until the target emits the flag. Keep the real method in the course and in
    the paid hint rungs, not here.

# FLAG: pick exactly ONE of the three shapes below.
#
# (1) Single static flag (this template's default). Its value MUST equal the
#     value compose.yaml injects at spawn, byte for byte.
flag: ESPILON{example_m0del_b_fl4g}
#
# (2) Session-scoped generator (delete `flag:` above and use this instead):
#       flag_generator: uuid            # ESPILON{<uuid4 hex>}, fresh per session
#       flag_generator: wordlist        # random entry per session from flags/wordlist.txt,
#                                       #   a file you ship beside lab.yaml, one candidate flag per line
#       flag_generator: hmac:<keyref>   # ESPILON{<hmac(secret, session_id)>}; <keyref> names a secret the
#                                       #   maintainers hold (you do not ship it); the grader re-derives the flag
#
# (3) Multi-flag staged objectives (delete `flag:` above and use this instead).
#     One flag row per entry; the running image must expose each `content` over
#     the protocol at runtime. See the multi-flag example in docs/model-b-lab.md:
#       flags:
#         - slug: stage-1
#           label: What the player achieved to earn this flag
#           content: ESPILON{stage_one_fl4g}
#           points: 100
#           order: 1
#           hint: |
#             Rung guidance for this specific stage.

prerequisites: []                       # other challenge slugs that should be cleared first
related_lesson_slug: example-course     # OPTIONAL back-link to the course lesson that teaches this
related_box: []                         # OPTIONAL list of prerequisite static-challenge slugs
